<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Адвент Календарь — Magic Inside</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Строгая 5-цветная палитра */
            --marshmallow: #fffbe9;
            --ribbon: #8f0500;
            --garland: #044529;
            --sugar-cookie: #ffecc5;
            --hot-cocoa: #562400;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--hot-cocoa);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--marshmallow);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Лёгкая текстура ризографии / зернистой бумаги поверх всего */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
            opacity: 0.055;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='risographGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23risographGrain)'/%3E%3C/svg%3E");
        }

        /* =========================================================
           1. ЭКРАН ЗАГРУЗКИ (РЕТРО-ПОСТЕР "MAGIC INSIDE")
           ========================================================= */
        #loader-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 38%, rgba(255, 236, 197, 0.14) 0%, var(--hot-cocoa) 68%);
            z-index: 40;
            transition: opacity 0.75s ease-out, transform 0.75s ease-out;
            padding: 16px;
            overflow: hidden;
        }

        /* Геометрическое обрамление в стиле плаката "Magic Inside" (#8f0500, #044529, #ffecc5) */
        .poster-backdrop {
            position: absolute;
            inset: 12px;
            border: 2px solid var(--sugar-cookie);
            border-radius: 18px;
            overflow: hidden;
            pointer-events: none;
            box-shadow: inset 0 0 0 6px var(--hot-cocoa), inset 0 0 0 8px var(--ribbon);
        }

        /* Контрастные цветовые блоки фона (слева красный Ribbon, справа хвойное окно Garland, снизу кремовый стол Sugar Cookie) */
        .poster-panel-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 46%;
            height: 68%;
            background-color: var(--ribbon);
            border-right: 4px solid var(--hot-cocoa);
        }

        .poster-panel-window {
            position: absolute;
            top: 24px;
            right: 20px;
            width: 44%;
            height: 56%;
            background-color: var(--garland);
            border: 5px solid var(--sugar-cookie);
            border-radius: 10px;
            box-shadow: inset 0 0 0 3px var(--hot-cocoa);
            overflow: hidden;
        }

        /* Переплёт зимнего окна на фоне плаката */
        .poster-panel-window::before {
            content: "";
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 5px;
            background-color: var(--sugar-cookie);
            transform: translateX(-50%);
        }
        .poster-panel-window::after {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 52%;
            height: 5px;
            background-color: var(--sugar-cookie);
            transform: translateY(-50%);
        }

        .poster-panel-table {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 34%;
            background: linear-gradient(180deg, var(--sugar-cookie) 0%, #f5d89e 100%);
            border-top: 6px solid var(--garland);
        }

        /* Тень от шара на столе */
        .globe-table-shadow {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-56%);
            width: 245px;
            height: 44px;
            background: radial-gradient(ellipse at center, var(--hot-cocoa) 35%, rgba(4, 69, 41, 0.45) 75%, transparent 100%);
            border-radius: 50%;
            opacity: 0.75;
        }

        /* Каллиграфический штамп "Magic Inside" на столе плаката */
        .poster-magic-stamp {
            position: absolute;
            bottom: 14px;
            right: 22px;
            text-align: right;
            transform: rotate(-6deg);
            color: var(--ribbon);
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 700;
            font-size: 20px;
            line-height: 0.95;
            letter-spacing: 0.01em;
            text-shadow: 0 1px 0 var(--marshmallow);
        }

        /* Контейнер снежного шара */
        .globe-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            margin-top: -18px;
        }

        .snow-globe {
            width: 256px;
            height: 256px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--ribbon) 0%, #6b0400 68%, var(--hot-cocoa) 100%);
            border: 5px solid var(--marshmallow);
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 0 0 4px var(--garland),
                inset 0 14px 28px rgba(255, 251, 233, 0.25),
                inset 0 -18px 26px rgba(86, 36, 0, 0.75),
                0 14px 28px rgba(86, 36, 0, 0.55);
            z-index: 2;
        }

        /* Стеклянные блики поверх шара (Marshmallow #fffbe9) */
        .glass-glare-main {
            position: absolute;
            top: 28px;
            right: 28px;
            width: 44px;
            height: 64px;
            background: rgba(255, 251, 233, 0.55);
            border-radius: 12px 28px 12px 24px;
            transform: rotate(-28deg);
            z-index: 6;
            pointer-events: none;
        }

        .glass-glare-arc {
            position: absolute;
            top: 14px;
            left: 26px;
            width: 90px;
            height: 46px;
            border-top: 5px solid rgba(255, 251, 233, 0.7);
            border-left: 3px solid rgba(255, 251, 233, 0.35);
            border-radius: 50%;
            transform: rotate(-28deg);
            z-index: 6;
            pointer-events: none;
        }

        .globe-scene-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #snowCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        /* Массивная фигурная подставка цвета Ribbon (#8f0500) с табличкой Sugar Cookie (#ffecc5) */
        .snow-globe-pedestal {
            width: 220px;
            height: 74px;
            margin-top: -18px;
            position: relative;
            z-index: 5;
        }

        /* Блок прогресса загрузки */
        .loader-footer {
            position: relative;
            z-index: 6;
            margin-top: 18px;
            background-color: var(--hot-cocoa);
            border: 2px solid var(--sugar-cookie);
            border-radius: 14px;
            padding: 10px 18px 12px;
            width: 248px;
            box-shadow: 0 8px 20px rgba(86, 36, 0, 0.5);
            text-align: center;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 236, 197, 0.2);
            border: 1px solid var(--sugar-cookie);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--sugar-cookie), var(--marshmallow));
            border-radius: 999px;
            transition: width 0.15s ease-out;
        }

        .loading-text {
            margin-top: 7px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--marshmallow);
        }

        /* =========================================================
           2. ОСНОВНОЙ ЭКРАН (ЗИМНИЙ ДОМ + ВИНТАЖНАЯ ОТКРЫТКА)
           ========================================================= */
        #main-screen {
            opacity: 0;
            transition: opacity 0.85s ease-in;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: var(--hot-cocoa);
            position: relative;
        }

        /* Небо над домом с салютом и падающим снегом */
        .sky-fireworks-section {
            position: relative;
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
            padding: 14px 14px 0;
            background: radial-gradient(circle at 50% 25%, rgba(255, 236, 197, 0.12) 0%, var(--hot-cocoa) 75%);
        }

        .fireworks-svg {
            width: 100%;
            height: 126px;
            display: block;
            overflow: visible;
        }

        /* Анимация искр салюта */
        @keyframes fireworkPulse {
            0%, 100% { transform: scale(0.95); opacity: 0.82; }
            50% { transform: scale(1.04); opacity: 1; }
        }
        .fw-burst-1 { transform-origin: 82px 54px; animation: fireworkPulse 3.6s ease-in-out infinite; }
        .fw-burst-2 { transform-origin: 200px 48px; animation: fireworkPulse 4.2s ease-in-out infinite 0.7s; }
        .fw-burst-3 { transform-origin: 318px 52px; animation: fireworkPulse 3.9s ease-in-out infinite 1.4s; }

        /* Винтажная открытка-заголовок "ADVENT Calendar" с пунктирной рамкой */
        .postcard-header-wrap {
            position: relative;
            margin: -10px auto 14px;
            max-width: 480px;
            background-color: var(--marshmallow);
            color: var(--ribbon);
            border-radius: 16px;
            padding: 14px 16px 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.38);
            text-align: center;
            z-index: 4;
        }

        /* Фирменная пунктирная рамка из референса (стежки цвета #8f0500) */
        .postcard-header-wrap::before {
            content: "";
            position: absolute;
            inset: 6px;
            border: 2.5px dashed var(--ribbon);
            border-radius: 11px;
            pointer-events: none;
        }

        .title-serif {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.14em;
            line-height: 0.9;
            color: var(--ribbon);
            margin: 0;
            text-transform: uppercase;
        }

        .title-script {
            font-family: 'Great Vibes', cursive;
            font-size: 40px;
            font-weight: 400;
            line-height: 0.85;
            color: var(--garland);
            margin: -4px 0 4px;
            text-shadow: 0 1px 0 var(--sugar-cookie);
        }

        .progress-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--sugar-cookie);
            border: 1px solid var(--ribbon);
            color: var(--hot-cocoa);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 999px;
            margin-top: 2px;
        }

        /* =========================================================
           АРХИТЕКТУРНЫЙ ФАСАД МНОГОЭТАЖНОГО ЗИМНЕГО ДОМА
           ========================================================= */
        .mansion-wrapper {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 12px 48px;
            position: relative;
        }

        /* Мансардная крыша с трубами, дымком и слуховыми окошками */
        .mansard-roof {
            width: 100%;
            display: block;
            margin-bottom: -2px;
            position: relative;
            z-index: 2;
        }

        /* Основной корпус дома */
        .house-facade {
            background-color: var(--ribbon);
            border-left: 5px solid var(--sugar-cookie);
            border-right: 5px solid var(--sugar-cookie);
            border-bottom: 10px solid var(--marshmallow);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
            position: relative;
            padding: 12px 10px 18px;
            /* Текстура кирпичной кладки */
            background-image: 
                linear-gradient(90deg, rgba(86, 36, 0, 0.22) 1px, transparent 1px),
                linear-gradient(rgba(86, 36, 0, 0.22) 1px, transparent 1px);
            background-size: 28px 14px;
        }

        /* Архитектурный карниз между этажами */
        .floor-cornice {
            height: 10px;
            background: linear-gradient(180deg, var(--marshmallow) 0%, var(--sugar-cookie) 65%, var(--hot-cocoa) 100%);
            margin: 12px -15px;
            border-radius: 3px;
            box-shadow: 0 3px 6px rgba(86, 36, 0, 0.45);
            position: relative;
            z-index: 3;
        }

        /* Ряд окон на этаже (сетка 3 колонки — 8 этажей = 24 окна) */
        .floor-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            position: relative;
        }

        /* =========================================================
           ОКОШКО-ЯЧЕЙКА АДВЕНТ-КАЛЕНДАРЯ (1–24)
           ========================================================= */
        .window-cell {
            position: relative;
            aspect-ratio: 0.84 / 1;
            background-color: var(--hot-cocoa);
            border: 3px solid var(--sugar-cookie);
            border-radius: 8px 8px 4px 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 
                inset 0 4px 12px rgba(0, 0, 0, 0.6),
                0 4px 8px rgba(86, 36, 0, 0.45);
            user-select: none;
            overflow: visible;
        }

        /* Арочные окна для верхних и средних этажей */
        .window-cell.arched {
            border-radius: 50% 50% 6px 6px / 34% 34% 6px 6px;
        }

        /* Заснеженный подоконник снизу каждого окна (#fffbe9) */
        .window-cell::after {
            content: "";
            position: absolute;
            bottom: -7px;
            left: -6px;
            right: -6px;
            height: 9px;
            background: linear-gradient(180deg, var(--marshmallow) 55%, var(--sugar-cookie) 100%);
            border-radius: 5px;
            box-shadow: 0 3px 5px rgba(86, 36, 0, 0.5);
            z-index: 5;
            pointer-events: none;
        }

        /* Декоративные зелёные ставни (#044529) для части окон */
        .window-cell.has-shutters::before {
            content: "";
            position: absolute;
            inset: 2px -7px 2px -7px;
            border-left: 5px solid var(--garland);
            border-right: 5px solid var(--garland);
            border-radius: 3px;
            pointer-events: none;
            z-index: 1;
        }

        .window-cell:active {
            transform: scale(0.95);
        }

        /* Миниатюрная табличка с номером дня в углу или над окном */
        .day-plaque {
            position: absolute;
            top: -9px;
            right: -5px;
            background-color: var(--marshmallow);
            color: var(--ribbon);
            border: 1.5px solid var(--ribbon);
            border-radius: 6px;
            padding: 1px 6px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.1;
            box-shadow: 0 2px 5px rgba(86, 36, 0, 0.45);
            z-index: 6;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .window-cell.opened .day-plaque {
            background-color: var(--garland);
            color: var(--marshmallow);
            border-color: var(--sugar-cookie);
        }

        /* Содержимое ЗАКРЫТОГО окна (ставни + линеарная гравюра или венок) */
        .closed-pane {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #6e3003 0%, var(--hot-cocoa) 100%);
            border-radius: inherit;
            overflow: hidden;
            transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 3;
        }

        /* Оконный переплёт внутри закрытого окна */
        .pane-cross-v {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 2px;
            background-color: rgba(255, 236, 197, 0.25);
            transform: translateX(-50%);
            pointer-events: none;
        }
        .pane-cross-h {
            position: absolute;
            left: 0; right: 0; top: 52%;
            height: 2px;
            background-color: rgba(255, 236, 197, 0.25);
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Карточка с красной линеарной гравюрой внутри закрытого окна */
        .engraving-card {
            width: 72%;
            height: 70%;
            background-color: var(--marshmallow);
            border: 1.5px solid var(--sugar-cookie);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            position: relative;
            z-index: 2;
        }

        .engraving-card svg {
            width: 100%;
            height: 100%;
            stroke: var(--ribbon);
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Рождественский венок (#044529 с красным бантом #8f0500) */
        .wreath-badge {
            width: 68%;
            height: 68%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* Содержимое ОТКРЫТОГО окна (тёплый свет комнаты #ffecc5 / #fffbe9 + подарок) */
        .opened-room {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 45%, var(--marshmallow) 15%, var(--sugar-cookie) 88%);
            border-radius: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.45s ease 0.1s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s;
            z-index: 2;
            box-shadow: inset 0 0 14px rgba(143, 5, 0, 0.25);
        }

        .opened-room svg {
            width: 74%;
            height: 74%;
            filter: drop-shadow(0 2px 3px rgba(86, 36, 0, 0.22));
        }

        /* Состояние открытого окна */
        .window-cell.opened {
            box-shadow: 
                0 0 18px rgba(255, 236, 197, 0.65),
                0 4px 10px rgba(86, 36, 0, 0.5);
        }

        .window-cell.opened .closed-pane {
            opacity: 0;
            transform: scale(1.15);
            pointer-events: none;
        }

        .window-cell.opened .opened-room {
            opacity: 1;
            transform: scale(1);
        }

        /* Парадный подъезд в центре нижнего этажа */
        .grand-entrance-banner {
            margin-top: 14px;
            background-color: var(--garland);
            border: 2px solid var(--sugar-cookie);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .entrance-text {
            font-size: 11px;
            line-height: 1.35;
            color: var(--marshmallow);
        }

        .reset-btn {
            background-color: var(--sugar-cookie);
            color: var(--hot-cocoa);
            border: 1.5px solid var(--ribbon);
            border-radius: 8px;
            padding: 6px 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.15s ease, background-color 0.2s;
        }

        .reset-btn:active {
            transform: scale(0.94);
            background-color: var(--marshmallow);
        }

        /* =========================================================
           МОДАЛЬНОЕ ОКНО ДНЯ С ТЁПЛЫМ ПОЗДРАВЛЕНИЕМ
           ========================================================= */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(86, 36, 0, 0.78);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .day-modal-card {
            position: relative;
            width: 100%;
            max-width: 340px;
            background-color: var(--marshmallow);
            color: var(--hot-cocoa);
            border: 3px solid var(--sugar-cookie);
            border-radius: 20px;
            padding: 24px 20px 20px;
            text-align: center;
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6);
            transform: translateY(24px) scale(0.94);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-backdrop.active .day-modal-card {
            transform: translateY(0) scale(1);
        }

        /* Пунктирная рамка открытки внутри модального окна */
        .day-modal-card::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 2px dashed var(--ribbon);
            border-radius: 13px;
            pointer-events: none;
        }

        .modal-day-badge {
            display: inline-block;
            background-color: var(--ribbon);
            color: var(--marshmallow);
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 16px;
            font-weight: 700;
            padding: 3px 16px;
            border-radius: 999px;
            border: 1.5px solid var(--sugar-cookie);
            margin-bottom: 12px;
        }

        .modal-illustration-box {

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP ---
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#562400');
            tg.setBackgroundColor('#562400');
        }

        function triggerHaptic(style = 'light') {
            if (tg && tg.HapticFeedback) {
                try {
                    tg.HapticFeedback.impactOccurred(style);
                } catch (e) {}
            }
        }

        // --- АНИМАЦИЯ СНЕГА В ШАРЕ НА CANVAS (#fffbe9) ---
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            const globe = document.getElementById('globe');
            if (!globe) return;
            width = canvas.width = globe.offsetWidth;
            height = canvas.height = globe.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const maxParticles = 70;

        class Snowflake {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -8;
                this.radius = Math.random() * 2.2 + 0.9;
                this.speedY = Math.random() * 0.85 + 0.35;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.45;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height + 5) this.reset(false);
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 251, 233, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Snowflake());
        }

        let snowRunning = true;
        function animateSnow() {
            if (!snowRunning) return;
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        // --- ЛОГИКА ЭКРАНА ЗАГРУЗКИ ---
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const loadingText = document.getElementById('loadingText');
        const loaderScreen = document.getElementById('loader-screen');
        const mainScreen = document.getElementById('main-screen');

        const loadInterval = setInterval(() => {
            progress += Math.random() * 16 + 6;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);

                setTimeout(() => {
                    loadingText.innerText = "Готово!";
                    loaderScreen.style.opacity = '0';
                    loaderScreen.style.transform = 'scale(1.03)';
                    setTimeout(() => {
                        snowRunning = false;
                        loaderScreen.classList.add('hidden');
                        mainScreen.classList.remove('hidden');
                        document.body.style.overflow = 'auto';
                        setTimeout(() => { mainScreen.style.opacity = '1'; }, 40);
                    }, 750);

            </svg>
        `;

        // --- СОХРАНЕНИЕ ПРОГРЕССА В LOCALSTORAGE ---
        const STORAGE_KEY = 'advent_calendar_opened_days_v2';
        let openedDays = new Set();

        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                    openedDays = new Set(parsed);
                }
            }
        } catch (e) {
            console.warn('Не удалось прочитать localStorage', e);
        }

        function saveProgress() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(openedDays)));
            } catch (e) {
                console.warn('Не удалось сохранить в localStorage', e);
            }
            updateCounterUI();
        }

        const openedCounter = document.getElementById('openedCounter');
        function updateCounterUI() {
            openedCounter.innerText = `Открыто окошек: ${openedDays.size} из 24`;
        }

        // --- МОДАЛЬНОЕ ОКНО ДНЯ ---
        const dayModal = document.getElementById('dayModal');
        const modalDayBadge = document.getElementById('modalDayBadge');
        const modalIllustration = document.getElementById('modalIllustration');
        const modalGiftTitle = document.getElementById('modalGiftTitle');
        const modalGiftWish = document.getElementById('modalGiftWish');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function openDayModal(dayData) {
            modalDayBadge.innerText = `День ${dayData.day} из 24`;
            modalIllustration.innerHTML = dayData.giftSvg;
            modalGiftTitle.innerText = dayData.title;
            modalGiftWish.innerText = dayData.wish;
            dayModal.classList.add('active');
        }

        function closeDayModal() {
            dayModal.classList.remove('active');
            triggerHaptic('light');
        }

        modalCloseBtn.addEventListener('click', closeDayModal);
        dayModal.addEventListener('click', (e) => {
            if (e.target === dayModal) closeDayModal();
        });

        // --- ПОСТРОЕНИЕ АРХИТЕКТУРНОГО ФАСАДА ДОМА (8 ЭТАЖЕЙ ПО 3 ОКНА = 24 ДНЯ) ---
        const houseFacade = document.getElementById('houseFacade');

        function renderMansion() {
            houseFacade.innerHTML = '';
            const totalFloors = 8;
            const colsPerFloor = 3;

            for (let floor = 0; floor < totalFloors; floor++) {
                const row = document.createElement('div');
                row.className = 'floor-row';

                for (let col = 0; col < colsPerFloor; col++) {
                    // Нумерация сверху вниз от 24 до 1 (как на высоком зимнем доме) или от 1 до 24
                    // Сделаем классический порядок 1–24 сверху вниз для интуитивной навигации
                    const dayIndex = floor * colsPerFloor + col;
                    const dayData = ADVENT_DAYS[dayIndex];
                    const dayNum = dayData.day;
                    const isOpened = openedDays.has(dayNum);

                    const cell = document.createElement('div');
                    cell.className = 'window-cell';
                    if (floor % 2 === 0) cell.classList.add('arched');
                    if ((floor + col) % 2 === 1) cell.classList.add('has-shutters');
                    if (isOpened) cell.classList.add('opened');

                    // Табличка с номером дня
                    const plaque = document.createElement('div');
                    plaque.className = 'day-plaque';
                    plaque.innerText = dayNum < 10 ? `0${dayNum}` : `${dayNum}`;

                    // Закрытая створка окна (чередуем рождественский венок и красную линеарную гравюру)
                    const closedPane = document.createElement('div');
                    closedPane.className = 'closed-pane';

                    const crossV = document.createElement('div');
                    crossV.className = 'pane-cross-v';
                    const crossH = document.createElement('div');
                    crossH.className = 'pane-cross-h';
                    closedPane.appendChild(crossV);
                    closedPane.appendChild(crossH);

                    if ((dayNum + floor) % 2 === 0) {
                        const wreath = document.createElement('div');
                        wreath.className = 'wreath-badge';
                        wreath.innerHTML = WREATH_SVG;
                        closedPane.appendChild(wreath);
                    } else {
                        const engraving = document.createElement('div');
                        engraving.className = 'engraving-card';
                        engraving.innerHTML = LINE_ART_SVGS[dayNum % LINE_ART_SVGS.length];
                        closedPane.appendChild(engraving);
                    }

                    // Открытая комната с тёплым светом и иллюстрацией подарка
                    const openedRoom = document.createElement('div');
                    openedRoom.className = 'opened-room';
                    openedRoom.innerHTML = dayData.giftSvg;

                    cell.appendChild(plaque);
                    cell.appendChild(closedPane);
                    cell.appendChild(openedRoom);

                    // Клик по окошку
                    cell.addEventListener('click', () => {
                        if (!openedDays.has(dayNum)) {
                            openedDays.add(dayNum);
                            cell.classList.add('opened');
                            saveProgress();
                            triggerHaptic('medium');
                            // Небольшая задержка перед открытием карточки, чтобы увидеть распахивание окна
                            setTimeout(() => openDayModal(dayData), 280);
                        } else {
                            triggerHaptic('light');
                            openDayModal(dayData);
                        }
                    });

                    row.appendChild(cell);
                }

                houseFacade.appendChild(row);

                // Межэтажный карниз после каждого этажа (кроме последнего)
                if (floor < totalFloors - 1) {
                    const cornice = document.createElement('div');
                    cornice.className = 'floor-cornice';
                    houseFacade.appendChild(cornice);
                }
            }

            // Парадный цоколь с кнопкой сброса прогресса
            const entrance = document.createElement('div');
            entrance.className = 'grand-entrance-banner';
            entrance.innerHTML = `
                <div class="entrance-text">Нажмите на любое окошко дома, чтобы зажечь свет и открыть подарок.</div>
                <button class="reset-btn" id="resetProgressBtn" type="button">Закрыть все</button>
            `;
            houseFacade.appendChild(entrance);

            document.getElementById('resetProgressBtn').addEventListener('click', () => {
                openedDays.clear();
                saveProgress();
                triggerHaptic('light');
                renderMansion();
            });
        }

        // Инициализация интерфейса
        updateCounterUI();
        renderMansion();
    </script>
</body>
</html>
