<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Christmas Advent — Изометрическая деревушка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Палитра в стиле референса Issey Roquet */
            --night-bg: #1a2744;
            --sky-top: #4f86f7;
            --sky-mid: #8da4ef;
            --sky-low: #c7b8ea;
            --mountain-teal: #639cb5;
            --mountain-lavender: #7f8bc2;
            --snow-white: #ffffff;
            --road-ice: #edf3f8;
            --house-pink: #f5a3b7;
            --house-blue: #8ec5e8;
            --house-navy: #1e2f5c;
            --house-cream: #fdf3d7;
            --house-crimson: #d94e67;
            --tree-mint: #84c7b8;
            --tree-pine: #2d7a6d;
            --gold-glow: #ffd166;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--night-bg);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--snow-white);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* =========================================================
           1. ЭКРАН ЗАГРУЗКИ (СНЕЖНЫЙ ШАР -> ZOOM-IN В ГОРОД)
           ========================================================= */
        #loader-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 42%, #2b3f6b 0%, var(--night-bg) 72%);
            z-index: 50;
            overflow: hidden;
            transition: opacity 0.6s ease-out;
        }

        /* Мягкое атмосферное сияние вокруг шара */
        .globe-ambient-aura {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(141, 164, 239, 0.28) 0%, rgba(199, 184, 234, 0.08) 55%, transparent 75%);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .globe-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: 50% 46%;
            will-change: transform, opacity;
        }

        /* Кинематографический Zoom-in прямо внутрь шара при 100% */
        #loader-screen.zooming-in .globe-stage {
            animation: zoomIntoVillage 1.35s cubic-bezier(0.65, 0, 0.25, 1) forwards;
        }

        #loader-screen.zooming-in .loader-ui-panel,
        #loader-screen.zooming-in .globe-pedestal,
        #loader-screen.zooming-in .globe-ambient-aura {
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }

        #loader-screen.zooming-in .snow-globe {
            border-color: rgba(255, 255, 255, 0);
            box-shadow: none;
            transition: border-color 0.45s ease, box-shadow 0.45s ease;
        }

        @keyframes zoomIntoVillage {
            0% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
            65% {
                transform: scale(3.4) translateY(-14px);
                opacity: 1;
            }
            100% {
                transform: scale(5.6) translateY(-22px);
                opacity: 0;
            }
        }

        /* Стеклянный снежный шар */
        .snow-globe {
            width: 268px;
            height: 268px;
            border-radius: 50%;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-low) 100%);
            border: 4px solid rgba(255, 255, 255, 0.65);
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 12px 26px rgba(255, 255, 255, 0.45),
                inset 0 -16px 28px rgba(30, 47, 92, 0.45),
                0 18px 42px rgba(10, 16, 32, 0.65);
            z-index: 2;
        }

        /* Блики на стекле */
        .globe-glare-left {
            position: absolute;
            top: 22px;
            left: 28px;
            width: 78px;
            height: 38px;
            border-top: 5px solid rgba(255, 255, 255, 0.72);
            border-left: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            transform: rotate(-32deg);
            z-index: 5;
            pointer-events: none;
        }

        .globe-glare-right {
            position: absolute;
            top: 42px;
            right: 26px;
            width: 18px;
            height: 44px;
            background: rgba(255, 255, 255, 0.42);
            border-radius: 999px;
            transform: rotate(-24deg);
            z-index: 5;
            pointer-events: none;
        }

        .mini-village-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #snowCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        /* Подставка снежного шара */
        .globe-pedestal {
            width: 196px;
            height: 54px;
            margin-top: -16px;
            position: relative;
            z-index: 3;
        }

        /* Прогресс-бар загрузки */
        .loader-ui-panel {
            margin-top: 24px;
            width: 240px;
            text-align: center;
            z-index: 6;
        }

        .progress-container {
            width: 100%;
            height: 7px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            overflow: hidden;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--sky-mid), var(--snow-white));
            border-radius: 999px;
            transition: width 0.16s ease-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .loading-text {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: rgba(255, 255, 255, 0.9);
        }

        /* =========================================================
           2. ОСНОВНОЙ ЭКРАН (ИЗОМЕТРИЧЕСКАЯ ДЕРЕВНЯ + АЛЬМАНАХ)
           ========================================================= */
        #main-screen {
            opacity: 0;
            height: 100dvh;
            width: 100vw;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: var(--road-ice);
            color: var(--house-navy);
            transition: opacity 0.75s ease-out;
            position: relative;
        }

        /* Верхняя панорамная секция: единая бесшовная сцена неба, гор и города */
        .hero-village-section {
            position: relative;
            width: 100%;
            min-height: clamp(540px, 78dvh, 880px);
            background: linear-gradient(
                180deg,
                #3b72eb 0%,
                #5687f2 22%,
                #7e9ef2 42%,
                #a8b3ee 56%,
                #cbb9eb 66%,
                #ffffff 68%,
                #ffffff 100%
            );
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .hero-village-section {
                min-height: clamp(640px, 84dvh, 960px);
            }
        }

        /* Атмосферное небо позади шапки: полумесяц, мерцающие звёзды и падающий снег */
        .hero-sky-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 68%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .hero-sky-backdrop svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes twinkleStar {
            0%, 100% { opacity: 0.35; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        @keyframes gentleSnowDrift {
            0% { transform: translateY(-16px) translateX(0); opacity: 0; }
            15% { opacity: 0.85; }
            85% { opacity: 0.85; }
            100% { transform: translateY(320px) translateX(16px); opacity: 0; }
        }

        .sky-star {
            transform-box: fill-box;
            transform-origin: center;
            animation: twinkleStar 3.8s ease-in-out infinite;
        }

        .sky-snow-flake {
            animation: gentleSnowDrift 9s linear infinite;
        }

        /* Шапка в духе референса Issey Roquet (поверх неба) */
        .village-header {
            position: relative;
            z-index: 15;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(16px, 3vw, 32px) clamp(16px, 4vw, 40px) 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            color: var(--snow-white);
            pointer-events: none;
        }

        .header-left {
            max-width: min(68%, 480px);
            pointer-events: auto;
        }

        .brand-tag {
            font-size: clamp(11px, 1.4vw, 13px);
            font-weight: 600;
            letter-spacing: 0.05em;
            opacity: 0.9;
            margin-bottom: 6px;
            display: inline-block;
        }

        .hero-title {
            margin: 0 0 8px;
            font-size: clamp(26px, 5vw, 46px);
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1.06;
            color: var(--snow-white);
            text-shadow: 0 2px 14px rgba(30, 47, 92, 0.22);
        }

        .hero-subtitle {
            margin: 0;
            font-size: clamp(12px, 1.6vw, 14px);
            line-height: 1.48;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.95);
        }

        .hero-subtitle strong {
            font-weight: 700;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
            pointer-events: auto;
        }

        .big-day-counter {
            font-size: clamp(32px, 6vw, 54px);
            font-weight: 800;
            line-height: 0.95;
            color: var(--snow-white);
            text-shadow: 0 3px 14px rgba(30, 47, 92, 0.24);
        }

        .counter-caption {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.92;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .glass-pill-btn {
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: var(--snow
